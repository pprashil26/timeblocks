<script type="module">import{DB,localDate,workTime,eventTime,duration}from'./timeblock-db.js';const $=x=>document.getElementById(x);let selected=localDate(),works=[],section,events=[],editEvent=null,dirty=new Map,reg=null,reloading=false;const db=new DB(m=>{if(m.date===selected||m.previousDate===selected||m.type==='RESTORED')render()});await db.open();for(let i=0;i<48;i++)$('evStart').add(new Option(eventTime(i),i));for(let i=1;i<=16;i++)$('evDuration').add(new Option(duration(i),i));function fmt(d){let[y,m,x]=d.split('-').map(Number);return new Intl.DateTimeFormat(undefined,{weekday:'short',day:'numeric',month:'short'}).format(new Date(y,m-1,x))}function addDay(d,n){let[y,m,x]=d.split('-').map(Number);return localDate(new Date(y,m-1,x+n))}function saveState(x){$('saved').textContent=x}async function flush(){for(let[k,p]of[...dirty]){clearTimeout(p.timer);dirty.delete(k);saveState('Saving…');if(p.type==='work')await db.saveWork(p.date,p.index,p.count,p.value,p.rev);else section=await db.saveSectionEntry(p.date,p.period,p.index,p.value,p.rev);saveState('✓ Saved')}}function queue(p){let k=`${p.type}-${p.index}`,old=dirty.get(k);if(old)clearTimeout(old.timer);p.timer=setTimeout(()=>flush().then(render).catch(e=>alert(e.message)),500);dirty.set(k,p);saveState('Saving…')}function input(value,oninput){let e=document.createElement('input');e.className='entry';e.value=value;e.maxLength=200;e.oninput=()=>oninput(e.value);return e}function sectionRows(period){let root=$(period);root.replaceChildren();section[period].forEach((v,i)=>{let r=document.createElement('div');r.className='untimed';r.innerHTML='<span class="dot">•</span>';r.append(input(v,x=>queue({type:'section',date:selected,period,index:i,value:x,rev:section.revision})));root.append(r)})}function workRow(a,s,covered,current){let r=document.createElement('div');r.className='workRow'+(current?' current':'');r.dataset.block=s;let t=document.createElement('div');t.className='time';t.innerHTML=workTime(s)+(current?'<span class="nowBadge"> NOW</span>':'');let c=document.createElement('div');c.className='cell';let e=input(a?.text||'',x=>queue({type:'work',date:selected,index:s,count:a?.blockCount||1,value:x,rev:a?.revision||0}));c.append(e);if(a?.blockCount>1){let m=document.createElement('span');m.className='meta';m.textContent=duration(a.blockCount);c.append(m)}if(a?.text){let d=document.createElement('div');d.className='dur';for(let n of[1,2,3,4]){if(s+n>16)continue;let b=document.createElement('button');b.type='button';b.textContent=duration(n);b.onclick=async()=>{await flush();await db.saveWork(selected,s,n,a.text,a.revision);render()};d.append(b)}c.append(d)}r.append(t,c);return r}function eventMarker(e){let x=document.createElement('div');x.className='eventMark';x.innerHTML=`🟨 ${e.title}<small>${eventTime(e.startBlock)} · ${duration(e.blockCount)}</small>`;x.onclick=()=>openEvent(e);return x}async function render(){[works,section,events]=await Promise.all([db.workFor(selected),db.section(selected),db.eventsFor(selected)]);$('date').textContent=fmt(selected);let now=new Date(),today=selected===localDate(),mins=now.getHours()*60+now.getMinutes();$('morningTitle').classList.toggle('now',today&&mins<540);$('eveningTitle').classList.toggle('now',today&&mins>=1020);sectionRows('morning');sectionRows('evening');let allDay=events.filter(e=>e.startBlock==null),ds=$('dateEvents');ds.replaceChildren();if(allDay.length){let x=document.createElement('div');x.className='eventStrip';x.textContent=allDay.length<=2?'🟨 '+allDay.map(e=>e.title).join(' · '):`🟨 ${allDay.length} Events`;x.onclick=()=>openEvent(allDay[0]);ds.append(x)}let workEvents=new Map;events.filter(e=>e.startBlock>=18&&e.startBlock<34).forEach(e=>{let k=e.startBlock-18;if(!workEvents.has(k))workEvents.set(k,[]);workEvents.get(k).push(e)});let before=events.filter(e=>e.startBlock!=null&&e.startBlock<18),after=events.filter(e=>e.startBlock>=34);before.forEach(e=>$('morning').prepend(eventMarker(e)));after.forEach(e=>$('evening').prepend(eventMarker(e)));let map=new Map(works.map(a=>[a.startBlock,a])),covered=new Set;works.forEach(a=>{for(let i=1;i<a.blockCount;i++)covered.add(a.startBlock+i)});let root=$('work');root.replaceChildren();for(let s=0;s<16;s++){(workEvents.get(s)||[]).forEach(e=>root.append(eventMarker(e)));if(covered.has(s))continue;let current=today&&mins>=540&&mins<1020&&Math.floor((mins-540)/30)===s;root.append(workRow(map.get(s),s,covered,current))}let next=events.filter(e=>e.startBlock!=null&&today&&e.startBlock*30>mins).sort((a,b)=>a.startBlock-b.startBlock)[0];$('nextEvent').hidden=!next;if(next){$('nextEvent').textContent=`🟨 NEXT ${eventTime(next.startBlock)} ${next.title}`;$('nextEvent').onclick=()=>document.querySelector(`[data-block="${next.startBlock-18}"]`)?.scrollIntoView({block:'center'})}}async function go(d){await flush();selected=d;render()}$('prev').onclick=()=>go(addDay(selected,-1));$('next').onclick=()=>go(addDay(selected,1));$('today').onclick=()=>go(localDate());function openEvent(e=null){editEvent=e;$('eventHeading').textContent=e?'Edit Event':'Add Event';$('evTitle').value=e?.title||'';$('evDate').value=e?.date||selected;$('evTimed').checked=e?.startBlock!=null;$('evTimeFields').hidden=e?.startBlock==null;$('evStart').value=e?.startBlock??18;$('evDuration').value=e?.blockCount??1;$('evDelete').hidden=!e;$('eventDlg').showModal()}$('addEvent').onclick=()=>openEvent();$('evTimed').onchange=e=>$('evTimeFields').hidden=!e.target.checked;$('evCancel').onclick=()=>$('eventDlg').close();$('eventForm').onsubmit=async e=>{e.preventDefault();let timed=$('evTimed').checked;await db.saveEvent({id:editEvent?.id,title:$('evTitle').value,date:$('evDate').value,startBlock:timed?+$('evStart').value:null,blockCount:timed?+$('evDuration').value:null},editEvent?.revision||0);$('eventDlg').close();render()};$('evDelete').onclick=async()=>{if(editEvent&&confirm(`Delete "${editEvent.title}"?`)){await db.deleteEvent(editEvent.id,editEvent.revision);$('eventDlg').close();rend ('eventDlg').open)return alert('Finish or cancel Event editing first.');await flush();w.postMessage({type:'SKIP_WAITING'})}};if(reg.waiting)show(reg.waiting);reg.onupdatefound=()=>{let w=reg.installing;w.onstatechange=()=>w.state==='installed'&&navigator.serviceWorker.controller&&show(w)};navigator.serviceWorker.oncontrollerchange=()=>{if(!reloading){reloading=true;location.reload()}};reg.update();setInterval(()=>reg.update(),9e5)}addEventListener('load',sw);await render();</script></body></html>
