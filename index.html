import {TimeblocksDB,localISODate,slotTime,currentSlot,durationLabel} from './timeblock-db.js';
const $=id=>document.getElementById(id);let selected=localISODate(),revisions=new Map(),dirty=new Map(),activities=[];const db=new TimeblocksDB(m=>{if((m.date===selected||m.type==='RESTORED')&&dirty.size===0)render(false)});await db.open();
function addDay(iso,n){const [y,m,d]=iso.split('-').map(Number);return localISODate(new Date(y,m-1,d+n))}function dateLabel(iso){const [y,m,d]=iso.split('-').map(Number),x=new Date(y,m-1,d);return new Intl.DateTimeFormat(undefined,{weekday:innerWidth<600?'short':'long',day:'numeric',month:innerWidth<600?'short':'long',year:innerWidth<600?undefined:'numeric'}).format(x)}function grow(t){t.style.height='auto';t.style.height=Math.max(40,t.scrollHeight)+'px'}function state(text,error=false){$('save').textContent=text;$('save').classList.toggle('error',error)}function isCurrent(a,now){return a.startSlot<=now&&now<a.startSlot+a.slotCount}function presets(max){return [1,2,3,4,6,8].filter(n=>n<=max)}

function makeEntry(a,isNow,isFuture,multi=false){const outer=document.createElement('div');outer.className=(multi?'activity ':'slot ')+(a.startSlot%4===0?'hour ':'')+(isNow?'current':isFuture?'future':'past');outer.dataset.start=a.startSlot;const time=document.createElement('div');time.className='time';const label=a.startSlot%2?`:${slotTime(a.startSlot).slice(3)}`:slotTime(a.startSlot);time.innerHTML=isNow?`${label}<span class="badge">NOW</span>`:label;const wrap=document.createElement('div');wrap.className=multi?'activityBody':'entryWrap';const ta=document.createElement('textarea');ta.className='entry';ta.rows=1;ta.maxLength=2000;ta.value=a.text||'';ta.setAttribute('aria-label',`${slotTime(a.startSlot)} activity`);ta.onfocus=()=>ta.placeholder='Add activity…';ta.onblur=async()=>{ta.placeholder='';if(a.revision===0&&ta.value.trim()){try{await commit(a.id);await render(false)}catch{}}};ta.oninput=()=>{grow(ta);schedule(a,ta.value)};wrap.append(ta);if(a.text){if(multi){const meta=document.createElement('div');meta.className='activityMeta';meta.textContent=`${slotTime(a.startSlot)}–${slotTime(a.startSlot+a.slotCount)} · ${durationLabel(a.slotCount)}`;wrap.append(meta)}wrap.append(durationControls(a))}outer.append(time,wrap);requestAnimationFrame(()=>grow(ta));return outer}
async function render(scrollNow=true){activities=await db.activitiesFor(selected);revisions=new Map(activities.map(a=>[a.id,a.revision]));$('dateBtn').textContent=dateLabel(selected);const timeline=$('timeline');timeline.replaceChildren();const map=new Map(activities.map(a=>[a.startSlot,a])),covered=new Set();for(const a of activities)for(let s=a.startSlot+1;s<a.startSlot+a.slotCount;s++)covered.add(s);const today=localISODate(),now=currentSlot();for(let slot=0;slot<96;){if(covered.has(slot)){slot++;continue}const a=map.get(slot)||{id:`${selected}#${slot}`,date:selected,startSlot:slot,slotCount:1,text:'',revision:0};const current=selected===today&&isCurrent(a,now),future=selected>today||(selected===today&&slot>now);const node=makeEntry(a,current,future,a.slotCount>1);if(slot%2===1&&!a.text)node.classList.add('minor');timeline.append(node);slot+=a.slotCount}updateNow();if(scrollNow&&selected===today)requestAnimationFrame(()=>document.querySelector('.current')?.scrollIntoView({block:'center'}))}
async function go(date,scroll){try{await flush();selected=date;await render(scroll)}catch(e){alert(`TIMEBLOCKS could not save before navigation: ${e.message}`)}}$('prev').onclick=()=>go(addDay(selected,-1),false);$('next').onclick=()=>go(addDay(selected,1),false);$('today').onclick=()=>go(localISODate(),true);let calendarMonth=null;function monthStart(iso){const [y,m]=iso.split('-').map(Number);return new Date(y,m-1,1)}function renderCalendar(){const dlg=$('calendarDialog'),grid=$('calendarGrid'),today=localISODate(),base=calendarMonth||monthStart(selected);calendarMonth=new Date(base.getFullYear(),base.getMonth(),1);$('calendarTitle').textContent=new Intl.DateTimeFormat(undefined,{month:'long',year:'numeric'}).format(calendarMonth);grid.replaceChildren();const mondayOffset=(calendarMonth.getDay()+6)%7,start=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth(),1-mondayOffset);for(let i=0;i<42;i++){const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),iso=localISODate(d),b=document.createElement('button');b.type='button';b.textContent=String(d.getDate());b.dataset.date=iso;b.classList.toggle('outside',d.getMonth()!==calendarMonth.getMonth());b.classList.toggle('todayDate',iso===today);b.classList.toggle('selectedDate',iso===selected);b.setAttribute('aria-label',new Intl.DateTimeFormat(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d));if(iso===selected)b.setAttribute('aria-selected','true');b.onclick=async()=>{dlg.close();await go(iso,false)};grid.append(b)}}function pick(){calendarMonth=monthStart(selected);renderCalendar();$('calendarDialog').showModal()}$('calendar').onclick=pick;$('dateBtn').onclick=pick;$('calPrev').onclick=()=>{calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()-1,1);renderCalendar()};$('calNext').onclick=()=>{calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,1);renderCalendar()};$('calToday').onclick=async()=>{$('calendarDialog').close function updateNow(){const c=document.querySelector('.current');if(!c||selected!==localISODate())return void($('now').hidden=true);const r=c.getBoundingClientRect(),h=document.querySelector('.stickyHead').getBoundingClientRect().bottom;$('now').hidden=r.top>=h&&r.bottom<=innerHeight;$('now').textContent=r.bottom<h?'↓ NOW':r.top>innerHeight?'↑ NOW':'NOW'}addEventListener('scroll',updateNow,{passive:true});$('now').onclick=()=>document.querySelector('.current')?.scrollIntoView({behavior:'smooth',block:'center'});

$('data').onclick=()=>$('dialog').showModal();$('close').onclick=()=>$('dialog').close();$('backup').onclick=async()=>{await flush();const p=await db.export(),blob=new Blob([JSON.stringify(p,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`timeblocks-backup-v2-${localISODate()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('restore').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const p=JSON.parse(await f.text());db.validate(p);if(!confirm('Restore backup? Current TIMEBLOCKS data will be replaced after a safety snapshot is created.'))return;await flush();await db.restore(p);$('status').textContent='Restore completed.';await render(false)}catch(err){$('status').textContent=err.message}finally{e.target.value=''}};
