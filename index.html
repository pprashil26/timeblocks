<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>TIMEBLOCKS</title><link rel="manifest" href="./manifest.webmanifest"><style>
:root{--red:#e82119;--ink:#0b0b0b;--muted:#727272;--line:#dedede;--hour:#b9b9b9;--soft:#f4f4f4;--now:#fff0ef}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f2f2f2;color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}.app{max-width:820px;min-height:100dvh;margin:auto;background:#fff;padding:calc(22px + env(safe-area-inset-top)) 24px calc(78px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{margin:3px 0 22px;font-size:34px;line-height:1;font-weight:900;letter-spacing:-1.1px}.save{font-weight:750;color:#333}.save.error{color:var(--red)}.nav{display:grid;grid-template-columns:48px 1fr 48px auto 48px;background:var(--soft);border-radius:8px;overflow:hidden;align-items:center}.nav button{height:50px;border:0;background:transparent;color:#111;font:800 16px/1 system-ui;cursor:pointer}.nav .arrow{font-size:25px}.nav .date{border-inline:1px solid #ddd;font-size:17px}.nav .today{height:34px;margin:8px 6px;padding:0 13px;border-radius:5px;background:var(--red);color:#fff;font-size:13px}.nav .cal{font-size:18px}.picker{position:absolute;opacity:0;pointer-events:none}.sub{margin:15px 2px 12px;color:#5e5e5e}.timeline{border-top:2px solid var(--hour)}.group{border-bottom:1px solid var(--line)}.group.hour{border-top:1px solid var(--hour)}.group:first-child{border-top:0}.quarter{display:grid;grid-template-columns:116px 1fr;min-height:42px;align-items:stretch;scroll-margin:150px}.quarter+.quarter{border-top:1px solid #ececec}.time{padding:10px 13px 8px 10px;border-right:1px solid #e0e0e0;font-weight:850;color:#111}.minor .time{padding-top:8px;color:#878787;font-size:13px;font-weight:750}.minorTime{padding-left:27px}.entry{width:100%;min-height:42px;border:0;outline:0;resize:none;overflow:hidden;padding:9px 14px 7px;background:transparent;color:#151515;font:650 16px/1.32 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}.entry:focus{box-shadow:inset 0 0 0 2px #161616}.entry:focus::placeholder{color:#aaa}.quarter.current{background:var(--now);border-left:5px solid var(--red)}.quarter.current .time{color:#111}.quarter.current .entry{font-weight:800}.badge{display:inline-block;margin-left:6px;padding:2px 5px;border-radius:4px;background:var(--red);color:#fff;font-size:10px;font-weight:900;vertical-align:1px}.range{display:block;margin-top:2px;color:#555;font-size:10px;font-weight:650}.future .time{color:#8d8d8d}.future.minor .time{color:#aaa}.now{position:fixed;right:max(16px,calc((100vw - 820px)/2 + 16px));bottom:22px;padding:12px 17px;border:0;border-radius:7px;background:#000;color:#fff;font-weight:850;box-shadow:0 3px 14px #0003;cursor:pointer}.footer{display:flex;justify-content:space-between;margin-top:18px;padding:18px 2px;border-top:1px solid #ddd;color:#595959}.linkbtn{border:0;background:transparent;text-decoration:underline;font:inherit;cursor:pointer}dialog{width:min(430px,calc(100% - 28px));border:0;border-radius:10px;padding:22px}dialog::backdrop{background:#0006}dialog h2{margin-top:0}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions button{border:1px solid #ccc;border-radius:6px;background:#fff;padding:10px 13px;font-weight:750}.actions .primary{border-color:#000;background:#000;color:#fff}.status{color:#a40000}.hint{font-size:13px;color:#666}@media(max-width:600px){.app{padding:calc(17px + env(safe-area-inset-top)) 11px calc(68px + env(safe-area-inset-bottom))}h1{margin-bottom:17px;font-size:27px}.save{font-size:13px}.nav{grid-template-columns:38px 1fr 38px auto 38px}.nav button{height:45px}.nav .date{font-size:13px}.nav .today{height:30px;margin:7px 3px;padding:0 8px;font-size:11px}.sub{font-size:13px}.quarter{grid-template-columns:78px 1fr;min-height:40px}.time{padding:9px 6px;font-size:15px}.minor .time{font-size:12px}.minorTime{padding-left:17px}.entry{min-height:40px;padding:8px 9px;font-size:15px}.badge{display:block;width:max-content;margin:3px 0 0}.range{font-size:9px}.now{right:12px;bottom:15px}}
</style></head><body><main class="app"><header><h1>TIMEBLOCKS</h1><div id="save" class="save">✓ Saved</div></header><nav class="nav" aria-label="Day navigation"><button id="prev" class="arrow" aria-label="Previous day">‹</button><button id="dateBtn" class="date" aria-label="Choose date"></button><button id="next" class="arrow" aria-label="Next day">›</button><button id="today" class="today">TODAY</button><button id="calendar" class="cal" aria-label="Choose date">▣</button><input id="datePicker" class="picker" type="date"></nav><p class="sub">15-minute tracking · grouped by 30 minutes</p><section id="timeline" class="timeline" aria-label="Daily timeblocks"></section><footer class="footer"><span>Stored on this device</span><button id="data" class="linkbtn">Backup</button></footer></main><button id="now" class="now" hidden>NOW</button><dialog id="dialog"><h2>Data</h2><p>Entries are stored locally in this browser.</p><div class="actions"><button id="backup" class="primary">Create backup</button><button id="restore">Restore backup</button><button id="close">Close</button></div><input id="file" type="file" accept=".json,application/json" hidden><p id="status" class="status"></p><p class="hint">Restore replaces current data after first creating an in-memory safety snapshot.</p></dialog><script type="module">
import {TimeblocksDB,localISODate,slotTime,currentSlot} from './timeblock-db.js';
const $=id=>document.getElementById(id);let selected=localISODate(),revisions=new Map(),dirty=new Map();const db=new TimeblocksDB(m=>{if((m.date===selected||m.type==='RESTORED')&&dirty.size===0)render(false)});await db.open();
function addDay(iso,n){const [y,m,d]=iso.split('-').map(Number);return localISODate(new Date(y,m-1,d+n))}function dateLabel(iso){const [y,m,d]=iso.split('-').map(Number),x=new Date(y,m-1,d);return new Intl.DateTimeFormat(undefined,{weekday:innerWidth<600?'short':'long',day:'numeric',month:innerWidth<600?'short':'long',year:innerWidth<600?undefined:'numeric'}).format(x)}function rangeFor(s){const start=slotTime(s),end=s===95?'00:00':slotTime(s+1);return `${start}–${end}`}function grow(t){t.style.height='auto';t.style.height=Math.max(40,t.scrollHeight)+'px'}function state(text,error=false){$('save').textContent=text;$('save').classList.toggle('error',error)}
async function commit(key){const p=dirty.get(key);if(!p)return;clearTimeout(p.timer);dirty.delete(key);state('Saving…');try{const rec=await db.save(p.date,p.slot,p.text,p.revision);revisions.set(key,rec?.revision||0);state('✓ Saved')}catch(e){state('Save failed',true);throw e}}
async function flush(){for(const key of [...dirty.keys()])await commit(key)}function schedule(date,slot,text){const key=`${date}#${slot}`,old=dirty.get(key);if(old)clearTimeout(old.timer);state('Saving…');const p={date,slot,text,revision:revisions.get(key)||0};p.timer=setTimeout(()=>commit(key).catch(()=>{}),500);dirty.set(key,p)}
async function render(scrollNow=true){const blocks=await db.blocksFor(selected),map=new Map(blocks.map(b=>[b.slot,b]));revisions=new Map(blocks.map(b=>[b.id,b.revision]));$('dateBtn').textContent=dateLabel(selected);$('datePicker').value=selected;const timeline=$('timeline');timeline.replaceChildren();const today=localISODate(),nowSlot=currentSlot();for(let base=0;base<96;base+=2){const group=document.createElement('div');group.className='group'+(base%4===0?' hour':'');for(let offset=0;offset<2;offset++){const slot=base+offset,b=map.get(slot),isNow=selected===today&&slot===nowSlot,isFuture=selected>today||(selected===today&&slot>nowSlot),q=document.createElement('div');q.className='quarter '+(offset?'minor ':'')+(isNow?'current':isFuture?'future':'past');q.dataset.slot=slot;const time=document.createElement('div');time.className='time';const label=offset?`<span class="minorTime">:${slotTime(slot).slice(3)}</span>`:slotTime(slot);time.innerHTML=isNow?`${label}<span class="badge">NOW</span><span class="range">${rangeFor(slot)}</span>`:label;const ta=document.createElement('textarea');ta.className='entry';ta.rows=1;ta.maxLength=2000;ta.value=b?.text||'';ta.setAttribute('aria-label',`${slotTime(slot)} timeblock entry`);ta.onfocus=()=>ta.placeholder='Add activity…';ta.onblur=()=>ta.placeholder='';ta.oninput=()=>{grow(ta);schedule(selected,slot,ta.value)};q.append(time,ta);group.append(q);requestAnimationFrame(()=>grow(ta))}timeline.append(group)}updateNow();if(scrollNow&&selected===today)requestAnimationFrame(()=>document.querySelector('.current')?.scrollIntoView({block:'center'}))}
async function go(date,scroll){try{await flush();selected=date;await render(scroll)}catch(e){alert(`TIMEBLOCKS could not save before navigation: ${e.message}`)}}$('prev').onclick=()=>go(addDay(selected,-1),false);$('next').onclick=()=>go(addDay(selected,1),false);$('today').onclick=()=>go(localISODate(),true);function pick(){const p=$('datePicker');p.showPicker?p.showPicker():p.click()}$('calendar').onclick=pick;$('dateBtn').onclick=pick;$('datePicker').onchange=e=>e.target.value&&go(e.target.value,false);
function updateNow(){const c=document.querySelector('.current');if(!c||selected!==localISODate())return void($('now').hidden=true);const r=c.getBoundingClientRect();$('now').hidden=r.top>=0&&r.bottom<=innerHeight;$('now').textContent=r.bottom<0?'↓ NOW':r.top>innerHeight?'↑ NOW':'NOW'}addEventListener('scroll',updateNow,{passive:true});$('now').onclick=()=>document.querySelector('.current')?.scrollIntoView({behavior:'smooth',block:'center'});
function boundary(){const n=new Date(),next=new Date(n);next.setSeconds(0,0);next.setMinutes(Math.floor(n.getMinutes()/15)*15+15);setTimeout(async()=>{if(selected===localISODate()&&dirty.size===0)await render(false);boundary()},Math.max(500,next-n))}document.addEventListener('visibilitychange',()=>{if(!document.hidden&&dirty.size===0&&selected===localISODate())render(false)});addEventListener('pagehide',()=>{for(const k of [...dirty.keys()])commit(k).catch(()=>{})});
$('data').onclick=()=>$('dialog').showModal();$('close').onclick=()=>$('dialog').close();$('backup').onclick=async()=>{await flush();const p=await db.export(),blob=new Blob([JSON.stringify(p,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`timeblocks-backup-${localISODate()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('restore').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const p=JSON.parse(await f.text());db.validate(p);if(!confirm('Restore backup? Current TIMEBLOCKS data will be replaced after a safety snapshot is created.'))return;await flush();await db.restore(p);$('status').textContent='Restore completed.';await render(false)}catch(err){$('status').textContent=err.message}finally{e.target.value=''}};
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));await render(true);boundary();
</script></body></html>
