<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>TIMEBLOCKS</title><link rel="manifest" href="./manifest.webmanifest"><style>
:root{--red:#ed211b;--ink:#111;--muted:#696969;--line:#dedede;--soft:#f5f5f5;--now:#fff0ef}*{box-sizing:border-box}body{margin:0;font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:#f3f3f3}.app{max-width:820px;min-height:100dvh;margin:auto;background:#fff;padding:22px 24px 80px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:34px;line-height:1;margin:4px 0 24px;font-weight:900;letter-spacing:-1px}.save{font-weight:700;color:#333}.save.err{color:var(--red)}.nav{display:grid;grid-template-columns:46px 1fr 46px auto 46px;align-items:center;background:var(--soft);border-radius:8px;overflow:hidden}.nav button,.datebtn{height:52px;border:0;background:transparent;font:inherit;font-weight:800;color:#111;cursor:pointer}.nav button{font-size:22px}.nav .today{background:var(--red);color:#fff;height:36px;margin:8px;border-radius:5px;padding:0 14px;font-size:14px}.datebtn{font-size:17px;border-left:1px solid #ddd;border-right:1px solid #ddd}.datepick{position:absolute;opacity:0;pointer-events:none}.sub{color:#555;margin:16px 2px 12px}.timeline{border-top:2px solid #cfcfcf}.row{display:grid;grid-template-columns:140px 1fr;min-height:54px;border-bottom:1px solid var(--line);align-items:stretch;scroll-margin:140px}.time{font-size:18px;font-weight:800;padding:14px 14px 12px 10px;border-right:1px solid var(--line);color:#111}.future .time{color:#777}.entry{width:100%;min-height:54px;border:0;resize:none;overflow:hidden;padding:14px 16px;background:transparent;color:#111;font:700 17px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;outline:none}.entry:focus{box-shadow:inset 0 0 0 2px #111}.entry:focus::placeholder{color:#aaa}.current{background:var(--now);border-left:6px solid var(--red);min-height:70px}.current .time{padding-left:10px}.current .entry{font-weight:850}.badge{display:inline-block;background:var(--red);color:#fff;border-radius:4px;font-size:11px;padding:3px 6px;margin-left:6px;vertical-align:2px}.range{display:block;font-size:12px;color:#555;margin-top:2px;font-weight:600}.nowbtn{position:fixed;right:max(18px,calc((100vw - 820px)/2 + 18px));bottom:28px;border:0;border-radius:7px;background:#000;color:#fff;padding:13px 18px;font-weight:850;font-size:15px;box-shadow:0 3px 14px #0003;cursor:pointer}.footer{display:flex;justify-content:space-between;color:#555;border-top:1px solid #ddd;padding:18px 2px;margin-top:18px}.footer button{border:0;background:none;text-decoration:underline;font:inherit;cursor:pointer}.dialog::backdrop{background:#0005}.dialog{border:0;border-radius:10px;padding:22px;max-width:430px;width:calc(100% - 32px)}.dialog h2{margin-top:0}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{padding:11px 14px;border:1px solid #ccc;border-radius:6px;background:#fff;font-weight:750}.actions .primary{background:#000;color:#fff;border-color:#000}.danger{color:#a60000}input[type=file]{max-width:100%}@media(max-width:600px){.app{padding:18px 12px 72px}h1{font-size:26px;margin-bottom:18px}.save{font-size:13px}.nav{grid-template-columns:38px 1fr 38px auto 38px}.nav button,.datebtn{height:46px}.datebtn{font-size:14px}.nav .today{height:32px;margin:7px 4px;padding:0 9px;font-size:12px}.sub{font-size:13px}.row{grid-template-columns:92px 1fr}.time{font-size:16px;padding:13px 8px}.entry{font-size:16px;padding:12px 10px}.badge{display:block;width:max-content;margin:4px 0 0}.range{font-size:11px}.nowbtn{right:14px;bottom:18px}}
</style></head><body><main class="app"><header><h1>TIMEBLOCKS</h1><div id="saveState" class="save">✓ Saved</div></header><section class="nav" aria-label="Day navigation"><button id="prev" aria-label="Previous day">‹</button><button id="dateButton" class="datebtn"></button><button id="next" aria-label="Next day">›</button><button id="today" class="today">TODAY</button><button id="calendar" aria-label="Choose date">▣</button><input id="datePicker" class="datepick" type="date"></section><div class="sub">15-minute blocks · All day</div><section id="timeline" class="timeline"></section><footer class="footer"><span>Stored on this device</span><button id="dataButton">Backup</button></footer></main><button id="nowButton" class="nowbtn" hidden>NOW</button><dialog id="dataDialog" class="dialog"><h2>Data</h2><p>TIMEBLOCKS stores its entries locally in this browser.</p><div class="actions"><button id="backup" class="primary">Create backup</button><button id="restorePick">Restore backup</button><input id="restoreFile" type="file" accept="application/json,.json" hidden></div><p id="restoreStatus" class="danger"></p><div class="actions" style="margin-top:18px"><button id="closeDialog">Close</button></div></dialog><script type="module">
import TimeblockDB,{createAutosaveController} from './timeblock-db.js';
const db=new TimeblockDB({onExternalChange:m=>{if(m.date===selectedDate) render(false)}});await db.open();
let selectedDate=TimeblockDB.localDate(), revisions=new Map(), initialized=false;const $=id=>document.getElementById(id);
const saveEl=$('saveState');const autosave=createAutosaveController(db,{delay:500,onStateChange:s=>{if(s.state==='pending'||s.state==='saving'){saveEl.textContent='Saving…';saveEl.classList.remove('err')}else if(s.state==='saved'){saveEl.textContent='✓ Saved';if(s.record) revisions.set(s.id,s.record.revision)}else if(s.state==='error'){saveEl.textContent='Save failed';saveEl.classList.add('err')}}});
function addDays(iso,n){const [y,m,d]=iso.split('-').map(Number),x=new Date(y,m-1,d+n);return TimeblockDB.localDate(x)}
function formatDate(iso){const [y,m,d]=iso.split('-').map(Number),x=new Date(y,m-1,d);return new Intl.DateTimeFormat(undefined,{weekday:innerWidth<600?'short':'long',day:'numeric',month:innerWidth<600?'short':'long',year:innerWidth<600?undefined:'numeric'}).format(x)}
function grow(t){t.style.height='auto';t.style.height=Math.max(54,t.scrollHeight)+'px'}
async function render(scrollNow=true){const view=await db.getDayView(selectedDate);revisions=new Map(view.blocks.map(b=>[b.id,b.revision]));$('dateButton').textContent=formatDate(selectedDate);$('datePicker').value=selectedDate;const t=$('timeline');t.replaceChildren();for(const s of view.timeline){const row=document.createElement('div');row.className='row '+(s.isCurrent?'current':s.isFuture?'future':'past');row.dataset.slot=s.slot;const time=document.createElement('div');time.className='time';time.innerHTML=s.isCurrent?`${s.start}<span class="badge">NOW</span><span class="range">${s.start}–${s.end}</span>`:s.start;const ta=document.createElement('textarea');ta.className='entry';ta.value=s.text;ta.maxLength=2000;ta.rows=1;ta.setAttribute('aria-label',`${s.start} timeblock entry`);ta.addEventListener('focus',()=>ta.placeholder='Add activity…');ta.addEventListener('blur',()=>ta.placeholder='');ta.addEventListener('input',()=>{grow(ta);autosave.schedule(selectedDate,s.slot,ta.value,revisions.get(s.id)??0)});row.append(time,ta);t.append(row);grow(ta)}updateNowButton();if(scrollNow&&selectedDate===TimeblockDB.localDate())requestAnimationFrame(()=>document.querySelector('.current')?.scrollIntoView({block:'center'}));initialized=true}
function updateNowButton(){const current=document.querySelector('.current');const same=selectedDate===TimeblockDB.localDate();if(!same||!current){$('nowButton').hidden=true;return}const r=current.getBoundingClientRect();$('nowButton').hidden=r.top>=0&&r.bottom<=innerHeight}
async function go(date,scroll=true){selectedDate=date;await render(scroll)}
$('prev').onclick=()=>go(addDays(selectedDate,-1),false);$('next').onclick=()=>go(addDays(selectedDate,1),false);$('today').onclick=()=>go(TimeblockDB.localDate(),true);$('calendar').onclick=()=>$('datePicker').showPicker?.()??$('datePicker').click();$('dateButton').onclick=()=>$('datePicker').showPicker?.()??$('datePicker').click();$('datePicker').onchange=e=>e.target.value&&go(e.target.value,false);$('nowButton').onclick=()=>document.querySelector('.current')?.scrollIntoView({behavior:'smooth',block:'center'});addEventListener('scroll',updateNowButton,{passive:true});
function nextBoundary(){const n=new Date(),m=n.getMinutes(),wait=((15-(m%15))%15)*60000-n.getSeconds()*1000-n.getMilliseconds();setTimeout(async()=>{if(selectedDate===TimeblockDB.localDate())await render(false);nextBoundary()},Math.max(500,wait))}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&initialized&&selectedDate===TimeblockDB.localDate())render(false)});
$('dataButton').onclick=()=>$('dataDialog').showModal();$('closeDialog').onclick=()=>$('dataDialog').close();$('backup').onclick=async()=>{const {json}=await db.exportBackup(),b=new Blob([json],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`timeblocks-backup-${TimeblockDB.localDate()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('restorePick').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const p=JSON.parse(await f.text());if(!confirm('Restore backup? Current TIMEBLOCKS data will be replaced. A safety snapshot will be created first.'))return;await db.restoreBackup(p,{mode:'replace'});$('restoreStatus').textContent='Restore completed.';await render(false)}catch(err){$('restoreStatus').textContent=err.message}finally{e.target.value=''}};
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
await render(true);nextBoundary();
</script></body></html>
