<script type="module">import{TimeblocksDB,localISODate,slotTime,currentSlot,durationLabel}from'./timeblock-db.js';const $=x=>document.getElementById(x),db=new TimeblocksDB(m=>{if(m.date===selected||m.previousDate===selected||m.type==='RESTORED')render(false)});await db.open();let selected=localISODate(),acts=[],events=[],dirty=new Map,calMonth=null,editing=null,sw=null,reloading=false;for(let i=0;i<96;i++)$('eventStart').add(new Option(slotTime(i),i));for(let i=1;i<=16;i++)$('eventDuration').add(new Option(durationLabel(i),i));function setSave(x){$('save').textContent=x}function addDay(x,n){let[y,m,d]=x.split('-').map(Number);return localISODate(new Date(y,m-1,d+n))}function fmt(x){let[y,m,d]=x.split('-').map(Number);return new Intl.DateTimeFormat(undefined,{weekday:innerWidth<600?'short':'long',day:'numeric',month:innerWidth<600?'short':'long',year:innerWidth<600?undefined:'numeric'}).format(new Date(y,m-1,d))}function grow(t){t.style.height='auto';t.style.height=Math.max(42,t.scrollHeight)+'px'}async function flush(){for(let[k,p]of[...dirty]){clearTimeout(p.timer);dirty.delete(k);setSave('Saving…');await db.saveActivity(p.date,p.slot,p.text,p.n,p.rev);setSave('✓ Saved')}}function schedule(a,t){let k=a.id,old=dirty.get(k);if(old)clearTimeout(old.timer);let p={date:a.date,slot:a.startSlot,text:t,n:a.slotCount,rev:a.revision||0};p.timer=setTimeout(()=>flush().then(()=>render(false)).catch(e=>alert(e.message)),500);dirty.set(k,p);setSave('Saving…')}function durationButtons(a){let d=document.createElement('div');d.className='duration';for(let n of[1,2,3,4,6,8]){if(a.startSlot+n>96)continue;let b=document.createElement('button');b.type='button';b.textContent=durationLabel(n);b.onclick=async()=>{try{await flush();await db.saveActivity(a.date,a.startSlot,a.text,n,a.revision);await render(false)}catch(e){alert(e.message)}};d.append(b)}return d}function activityNode(a,now){let multi=a.slotCount>1,n=document.createElement('div');n.className=(multi?'activity ':'slot ')+(a.sta s)||[]).forEach(e=>t.append(eventNode(e)));if(covered.has(s)){s++;continue}let a=amap.get(s)||{id:`${selected}#${s}`,date:selected,startSlot:s,slotCount:1,text:'',revision:0};let node=activityNode(a,now);if(s%2&&!a.text)node.classList.add('minor');t.append(node);s+=a.slotCount}let next=events.filter(e=>e.startSlot!=null&&selected===localISODate()&&e.startSlot>now).sort((a,b)=>a.startSlot-b.startSlot)[0];$('nextEvent').hidden=!next;if(next){$('nextEvent').textContent=`NEXT · ${slotTime(next.startSlot)} ${next.title}`;$('nextEvent').onclick=()=>document.querySelector(`[data-start="${next.startSlot}"]`)?.scrollIntoView({block:'center'})}updateNow();if(scroll&&selected===localISODate())requestAnimationFrame(()=>document.querySelector('.current')?.scrollIntoView({block:'center'}))}async function go(d,scroll=false){await flush();selected=d;await render(scroll)}$('prev').onclick=()=>go(addDay(selected,-1));$('next').onclick=()=>go(addDay(selected,1));$('today').onclick=()=>go(localISODate(),true);function openEvent(e=null,preset=null){editing=e;let d=preset?.date||e?.date||selected,s=preset?.startSlot??e?.startSlot??null;$('eventHeading').textContent=e?'Edit Event':'Add Event';$('eventId').value=e?.id||'';$('eventTitle').value=e?.title||'';$('eventDate').value=d;$('hasTime').checked=s!=null;$('timeFields').hidden=s==null;$('eventStart').value=s??0;$('eventDuration').value=e?.slotCount||1;$('deleteEvent').hidden=!e;$('eventDialog').showModal()}$('addEvent').onclick=()=>openEvent();$('hasTime').onchange=e=>$('timeFields').hidden=!e.target.checked;$('cancelEvent').onclick=()=>$('eventDialog').close();$('eventForm').onsubmit=async e=>{e.preventDefault();let timed=$('hasTime').checked,input={id:$('eventId').value||undefined,title:$('eventTitle').value,date:$('eventDate').value,startSlot:timed?+$('eventStart').value:null,slotCount:timed?+$('eventDuration').value:null};await db.saveEvent(input,editing?.revision);$('eventDialog').close();await render(false)};$('deleteEvent').oncli ;a.href=URL.createObjectURL(blob);a.download=`timeblocks-backup-v3-${localISODate()}.json`;a.click()};$('restore').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;await db.restore(JSON.parse(await f.text()));$('dataDialog').close();await render(false)};async function setupSW(){if(!('serviceWorker'in navigator))return;sw=await navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'});let show=w=>{if(!w)return;$('update').hidden=false;$('updateNow').onclick=async()=>{if($('eventDialog').open)return alert('Finish or cancel the Event edit before updating.');await flush();w.postMessage({type:'SKIP_WAITING'})}};if(sw.waiting)show(sw.waiting);sw.onupdatefound=()=>{let w=sw.installing;w.onstatechange=()=>w.state==='installed'&&navigator.serviceWorker.controller&&show(w)};navigator.serviceWorker.oncontrollerchange=()=>{if(!reloading){reloading=true;location.reload()}};sw.update();setInterval(()=>sw.update(),9e5)}addEventListener('load',setupSW);await render(true);</script></body></html>
